<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, sans-serif;">

```
<div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 40px; border-radius: 8px; text-align: center;">

    <h2 style="color: #222222;">
        Reset Your Password
    </h2>

    <p style="color: #555555; font-size: 16px; line-height: 1.6;">
        Hi {{email}}, We received a request to reset your password.
        Click the button below to create a new password.
    </p>

    <div style="margin: 30px 0;">

        <a
            href={{full_link}}
            style="
                display: inline-block;
                padding: 14px 28px;
                background-color: #007bff;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 16px;
                font-weight: bold;
            "
        >
            Reset Password
        </a>

    </div>

    <p style="color: #888888; font-size: 13px; line-height: 1.5;">
        If you did not request a password reset, you can safely ignore this email.
    </p>

</div>
```

</body>
</html>
